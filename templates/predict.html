<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Predict</title><style>body{font-family:Arial,sans-serif;max-width:1000px;margin:0 auto;padding:32px;background:#f6f8fb;color:#172033}nav{display:flex;gap:18px;margin-bottom:40px}a{color:#3157d5;text-decoration:none}.card{background:white;padding:28px;border-radius:14px;box-shadow:0 4px 20px #0001}button{padding:12px 18px;border:0;border-radius:8px;background:#3157d5;color:white}input,select{width:100%;padding:10px;margin:6px 0 14px;box-sizing:border-box}pre{white-space:pre-wrap;background:#eef2f8;padding:16px}</style></head><body><nav><a href="/">Home</a><a href="/predict">Predict</a><a href="/analytics">Analytics</a><a href="/about">About</a></nav><div class="card"><h1>Quality Prediction</h1><p>Select an industry and model, then enter the 10 numeric feature values separated by commas.</p><select id="industry"><option>Food Processing</option><option>Textile</option><option>Cosmetics</option></select><select id="model"><option>Logistic Regression</option><option>Decision Tree</option><option>Random Forest</option><option>Gradient Boosting</option><option>AdaBoost</option><option>Extra Trees</option><option>Bagging</option><option>Support Vector Machine</option><option>K-Nearest Neighbors</option><option>Naive Bayes</option></select><input id="features" placeholder="12, 22, 5, 4, 2, 6.5, 8, 0.7, 7, 15"><button onclick="go()">Predict</button><pre id="out">Prediction result will appear here.</pre></div><script>async function go(){let f=document.getElementById('features').value.split(',').map(Number);let r=await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({industry:document.getElementById('industry').value,model:document.getElementById('model').value,features:f})});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
